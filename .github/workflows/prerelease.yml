name: Binary prerelease

# Verified main commits become prereleases; stable releases and update notices are unchanged.
on:
  workflow_run:
    workflows: [Verify PR]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One group per commit: a shared group keeps only one pending run, so a burst of merges would drop commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prerelease:
    # A manual run publishes main only: from another branch it would ship that branch's unverified code.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      NODE_OPTIONS: --max-old-space-size=4096
      BUN_JSC_forceRAMSize: "4294967296"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SHA }}
          # npm ci runs dependency install scripts: keep the write token out of .git/config (gh reads GH_TOKEN).
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Prepare pinned OMP main source
        run: npx bun runner/scripts/use-omp-build.ts
      - name: Pin the binary release identity
        run: |
          now=$(date -u +%s)
          echo "RELEASE_TITLE=$(date -u -d "@$now" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$(date -u -d "@$now" +%Y%m%dT%H%M%SZ)-$(git rev-parse --short=10 "$SHA")" >> "$GITHUB_ENV"
      - name: Build the release binaries
        env:
          OMP_WEB_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: sh scripts/build-release-binaries.sh
      - name: Allow isolated native fixture scopes
        run: |
          rule="polkit.addRule(function(action, subject) { if (action.id === 'org.freedesktop.systemd1.manage-units' && subject.user === '$(id -un)' && /\\.scope$/.test(action.lookup('unit') || '')) { return polkit.Result.YES; } });"
          printf '%s\n' "$rule" | sudo tee /etc/polkit-1/rules.d/49-ompweb-fixture-scopes.rules >/dev/null
          systemd-run --scope --quiet --collect --no-ask-password true
      - run: npm run smoke -- --binary release/ompweb-linux-x64/ompweb
      - name: Smoke test standalone OMP
        run: |
          runtime_dir=$(mktemp -d)
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" timeout --kill-after=10s 120s runner/release/omp-linux-x64 --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" timeout --kill-after=10s 120s runner/release/omp-linux-x64 --smoke-test

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$RELEASE_TITLE"
          tag="$RELEASE_TAG"
          subject=$(git log -1 --format=%s "$SHA")
          # A draft first, so a failed upload never leaves a published prerelease missing archives.
          omp_commit=$(node -p 'require("./runner/omp-build.json").commit')
          [[ "$omp_commit" =~ ^[0-9a-f]{40}$ ]]
          runners=(ompweb-omp-linux-x64 ompweb-omp-linux-arm64 ompweb-omp-darwin-x64 ompweb-omp-darwin-arm64 ompweb-omp-windows-x64.exe)
          (cd runner/release && sha256sum "${runners[@]}" > ompweb-omp.sha256)
          gh release create "$tag" release/ompweb-*.tar.gz release/ompweb-*.zip runner/release/omp-* "${runners[@]/#/runner/release/}" runner/release/ompweb-omp.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --draft --prerelease --title "$title" \
            --notes "Binaries built from $GITHUB_REPOSITORY@$SHA ($subject).
          OMP_COMMIT=$omp_commit
          OMP source: https://github.com/can1357/oh-my-pi/commit/$omp_commit
          runner/patches adds an optional host hook and unique split-chunk paths; standalone defaults are unchanged."
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
