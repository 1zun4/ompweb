name: Publish npm package

on:
  push:
    tags:
      - "v*"

env:
  TAG: ${{ github.ref_name }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      BUN_JSC_forceRAMSize: "4294967296"
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test "$TAG" = "v$VERSION"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@^11.5.1
      - run: npm ci
      - name: Prepare pinned OMP main source
        run: npx bun runner/scripts/use-omp-build.ts
      # Match Verify PR: allow isolated fixtures, never control of the runner's service.
      - name: Allow isolated native fixture scopes
        run: |
          rule="polkit.addRule(function(action, subject) { if (action.id === 'org.freedesktop.systemd1.manage-units' && subject.user === '$(id -un)' && /\\.scope$/.test(action.lookup('unit') || '')) { return polkit.Result.YES; } });"
          printf '%s\n' "$rule" | sudo tee /etc/polkit-1/rules.d/49-ompweb-fixture-scopes.rules >/dev/null
          systemd-run --scope --quiet --collect --no-ask-password true
      - run: npm test
      - run: npm run build
      # Builds the omp runners too, which the source smoke spawns from runner/release/. The archives leave them out:
      # every install fetches its runner from this release (lib/omp/runner-fetch.ts), attached below.
      - name: Build the release binaries
        run: sh scripts/build-release-binaries.sh --no-runner
      - run: npm run smoke
      # --omp: the draft release cannot serve the runner to the binary yet.
      - run: npm run smoke -- --binary release/ompweb-linux-x64/ompweb --omp runner/release/ompweb-omp-linux-x64
      - name: Smoke test standalone OMP
        run: |
          runtime_dir=$(mktemp -d)
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" timeout --kill-after=10s 120s runner/release/omp-linux-x64 --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" timeout --kill-after=10s 120s runner/release/omp-linux-x64 --smoke-test

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            node bin/generate-release-notes.js --tag "$TAG" --output release-notes.md
            printf '\nOMP_COMMIT=%s\n' "$(node -p 'require("./runner/omp-build.json").commit')" >> release-notes.md
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release-notes.md --draft
          fi

      # The runners, by the names and checksum listing lib/omp/runner-fetch.ts fetches (OMP_RUNNER_ASSET,
      # OMP_RUNNER_CHECKSUMS), for binary and npm installs alike.
      - name: Attach the binaries and the omp runners to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runners=(ompweb-omp-linux-x64 ompweb-omp-linux-arm64 ompweb-omp-darwin-x64 ompweb-omp-darwin-arm64 ompweb-omp-windows-x64.exe)
          (cd runner/release && sha256sum "${runners[@]}" > ompweb-omp.sha256)
          gh release upload "$TAG" release/ompweb-*.tar.gz release/ompweb-*.zip runner/release/omp-* "${runners[@]/#/runner/release/}" runner/release/ompweb-omp.sha256 --repo "$GITHUB_REPOSITORY" --clobber

      # Before npm: an npm install fetches its runner from this release, which a draft does not serve.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Publish to npm
        run: |
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view "$PACKAGE_NAME@$VERSION" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published"
          else
            npm publish --provenance --access public
          fi

  notify-discord:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post release notes to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DISCORD_WEBHOOK_URL="$(printf '%s' "$DISCORD_WEBHOOK_URL" | tr -d '\r\n')"
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*/*) ;;
            *) echo 'DISCORD_RELEASES_WEBHOOK is not a valid Discord webhook URL' >&2; exit 1 ;;
          esac

          RELEASE_JSON="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,url)"

          jq -n \
            --arg body "$(jq -r '.body' <<<"$RELEASE_JSON")" \
            --arg title "OMPWEB $TAG" \
            --arg url "$(jq -r '.url' <<<"$RELEASE_JSON")" \
            '{
              username: "OMPWEB Releases",
              embeds: [{
                title: $title,
                url: $url,
                description: $body[0:3800],
                color: 15105570,
                footer: {text: "GitHub Release"}
              }]
            }' > discord-release.json

          curl --fail-with-body \
            --header "Content-Type: application/json" \
            --data @discord-release.json \
            "$DISCORD_WEBHOOK_URL"
